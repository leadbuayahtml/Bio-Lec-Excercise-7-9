<style>
/* Layout: sticky chunk rail on the left, one short chunk at a time on the right. Stacks to a row of numbered buttons on phones. */
:root {
  --bg: #F2F5F2;
  --surface: #FFFFFF;
  --surface-2: #E7EEE9;
  --fg: #15211B;
  --muted: #54645B;
  --line: #CCD8D0;
  --accent: #1D6A4C;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9EBE2;
  --mark: #8E1F30;
  --good: #1B7A45;
  --good-soft: #DDF0E3;
  --bad: #B03020;
  --bad-soft: #F7DEDA;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1713; --surface: #16211B; --surface-2: #1F2D25; --fg: #E3ECE6; --muted: #9BAEA3; --line: #2B3C32;
    --accent: #5CC49A; --accent-ink: #0B1510; --accent-soft: #1B3328; --mark: #F08A97;
    --good: #6FD39A; --good-soft: #1A3326; --bad: #F29080; --bad-soft: #3A1F1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1713; --surface: #16211B; --surface-2: #1F2D25; --fg: #E3ECE6; --muted: #9BAEA3; --line: #2B3C32;
  --accent: #5CC49A; --accent-ink: #0B1510; --accent-soft: #1B3328; --mark: #F08A97;
  --good: #6FD39A; --good-soft: #1A3326; --bad: #F29080; --bad-soft: #3A1F1B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sp { font-style: italic; }

.top { display: grid; gap: 8px; margin-bottom: 26px; }
.kicker { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.05; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
nav { position: sticky; top: 16px; min-width: 0; }
.prog { display: grid; gap: 8px; }
.pc { margin: 0; font-size: .95rem; color: var(--muted); }
.pc strong { color: var(--fg); font-family: var(--f-mono); font-weight: 500; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width .3s ease; } }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.step button { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 8px; font: inherit; font-size: .95rem; line-height: 1.3; color: var(--fg); cursor: pointer; }
.step button:hover { background: var(--surface-2); }
.step[aria-current="step"] button { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.step .n { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 6px; font-family: var(--f-mono); font-size: .8rem; background: var(--surface); }
.step.done .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.linkbtn { margin-top: 14px; background: none; border: 0; padding: 0; font: inherit; font-size: .85rem; color: var(--muted); text-decoration: underline; cursor: pointer; }

.chunk { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 22px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.15rem); line-height: 1.1; letter-spacing: -.015em; margin: 4px 0 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 500; font-size: 1.1rem; margin: 0; }
.label { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.intro { margin: 0; max-width: 65ch; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 70ch; }
.points li { position: relative; padding-left: 22px; }
.points li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.points strong, .intro strong { font-weight: 600; }
.small { font-size: .9rem; color: var(--muted); margin: 0; }
.note { font-size: .92rem; color: var(--muted); margin: 0; max-width: 68ch; }
.note a, .small a { color: var(--accent); }

.panel { background: var(--surface-2); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.btn { font: inherit; font-weight: 600; font-size: .95rem; padding: 9px 15px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-family: var(--f-mono); font-size: .8rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cell { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.cell p { margin: 0; }
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: j; max-width: 70ch; }
.jobs li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.jobs li::before { counter-increment: j; content: counter(j); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: var(--accent-soft); font-family: var(--f-mono); font-size: .8rem; }

/* tap-to-reveal mode */
.cloak { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: inherit; cursor: default; display: inline; }
.cloak.blk { display: block; width: 100%; }
[data-cloak="on"] .cloak:not(.shown) { color: transparent; background: var(--line); border-radius: 4px; cursor: pointer; -webkit-user-select: none; user-select: none; }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.term { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.term p { margin: 0; font-size: .97rem; }
.bar2 { display: flex; justify-content: flex-start; }

/* ranks ladder */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: .92rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.ladder { display: grid; gap: 6px; }
.rung { --step: 12px; display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; background: var(--surface); margin-left: calc(var(--i) * var(--step)); }
.rung .r { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rung .cloak { font-weight: 600; }
.rung.sp-row .cloak { font-style: italic; }

/* dichotomous key */
.keygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.keybox, .walkbox { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.kc { display: grid; gap: 2px; padding: 6px 8px; border-radius: 8px; }
.kc.on { background: var(--accent-soft); }
.kl { display: flex; align-items: baseline; gap: 8px; font-size: .97rem; }
.kl .num { font-family: var(--f-mono); width: 1.4rem; flex: none; color: var(--muted); }
.kl .dots { flex: 1; min-width: 12px; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.kl .lead { font-weight: 600; }
.spec { margin: 0; font-weight: 600; }
.res { padding: 10px 12px; border-radius: 8px; }
.res.good { background: var(--good-soft); color: var(--fg); }
.res.bad { background: var(--bad-soft); color: var(--fg); }

/* plants tree */
.ptree, .ptree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 2px solid var(--line); }
.ptree { border-left: 0; padding-left: 0; }
.ptree li { padding: 3px 0 3px 8px; }
.ptree li > span { font-weight: 600; }
.todo { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; padding: 6px 0; }
.todo input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }
.todo input:checked + span { color: var(--muted); text-decoration: line-through; }

/* tables */
.tw { overflow-x: auto; border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 460px; background: var(--surface); }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: .95rem; }
thead th { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
tbody th { font-weight: 600; width: 28%; }
.diff td, .diff th { background: var(--accent-soft); }
.ne { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }
.cmpbar { display: flex; flex-wrap: wrap; gap: 12px; }
.cmpbar label { display: grid; gap: 4px; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
select { font: inherit; font-size: .95rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-width: 11rem; }

/* quizzes */
.checks { display: grid; gap: 12px; }
.q, .dq-box { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); }
.q > p, .dq { margin: 0; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.right { background: var(--good-soft); border-color: var(--good); opacity: 1; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); opacity: 1; }
.opt[disabled] { cursor: default; color: var(--fg); }
.fb { margin: 0; font-size: .95rem; color: var(--muted); min-height: 1.4em; }
.fb.good { color: var(--good); }
.fb.bad { color: var(--bad); }
.score { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }

.foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 16px; }
.stat { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  nav { position: static; }
  .steps { flex-direction: row; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .step button { grid-template-columns: 1fr; width: auto; padding: 0; background: none !important; box-shadow: none !important; }
  .step .t { display: none; }
  .step .n { width: 36px; height: 36px; }
  .step[aria-current="step"] .n { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .rung { --step: 3px; grid-template-columns: 6.2rem minmax(0, 1fr); }
}

/* svg tree */
.tree { width: 100%; max-width: 560px; height: auto; }
.tl { stroke: var(--fg); stroke-width: 2; fill: none; stroke-linecap: round; }
.tn { fill: var(--accent); }
.tt { fill: var(--fg); font: 15px var(--f-body); }
.tm { fill: var(--muted); font: 12px var(--f-mono); }

/* ---------- added for the combined guide (exercise tabs, Exercises 7 and 9) ---------- */
.exbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.extab { font: inherit; font-size: .97rem; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; align-items: baseline; gap: 8px; }
.extab:hover { border-color: var(--accent); }
.extab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.extab .ct { font-family: var(--f-mono); font-size: .75rem; opacity: .8; }
.eq { margin: 0; font-family: var(--f-mono); font-size: clamp(.95rem, 2.6vw, 1.2rem); text-align: center; padding: 8px 4px; overflow-wrap: anywhere; }
.outg { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.ocell { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; justify-items: start; align-content: start; }
.ocell p { margin: 0; font-size: .97rem; }
.ocell .nm { font-weight: 600; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--fg); }
.sw.tube { width: 30px; height: 58px; border-radius: 4px 4px 16px 16px; }
.sw.leaf { width: 58px; height: 38px; border-radius: 60% 0 60% 0; }
.hint { margin: 0; color: var(--muted); font-size: .95rem; }
</style>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };

const KEYSTORE = 'bio10-ex789';
let S = { ex: 7, cur: 0, curs: { 7: 0, 8: 0, 9: 0 }, ok: {}, todo: {} };
try {
  const raw = localStorage.getItem(KEYSTORE);
  if (raw) { S = Object.assign(S, JSON.parse(raw)); }
  else {
    // carry over progress saved by the standalone Exercise 8 guide
    const old = localStorage.getItem('bio10-ex8');
    if (old) { const o = JSON.parse(old); S.ok = o.ok || {}; S.todo = o.todo || {}; S.curs[8] = o.cur || 0; S.ex = 8; }
  }
} catch (e) {}
if (!S.curs) S.curs = { 7: 0, 8: 0, 9: 0 };
if (![7, 8, 9].includes(S.ex)) S.ex = 7;
function save() { try { S.curs[S.ex] = S.cur; localStorage.setItem(KEYSTORE, JSON.stringify(S)); } catch (e) {} }

/* ---------- data: Exercise 8 (unchanged) ---------- */
const TERMS = [
  ['Taxonomy', 'Theory and practice of classifying organisms.'],
  ['Identification', 'Placing individuals into previously established classes by deductive procedures.'],
  ['Classification', 'Ordering organisms into a hierarchy of categories.'],
  ['Hierarchy', 'An orderly array made of a series of inclusive levels called categories.'],
  ['Category', 'A rank or level in a hierarchic classification. Examples: kingdom, phylum, division, class, order, family, genus, species.'],
  ['Taxon', 'Any distinctive group worthy of being assigned to a definite category. Higher taxa: birds, vertebrates. Lower taxa: maya, dog, man.'],
  ['Phenon', 'A phenotypically uniform sample at the species level. The term is specific to insects, where males and females often belong to different phena.'],
  ['Nomenclature', 'Giving a distinctive name to an organism based on a particular classification scheme.']
];
const RANKS = ['Domain', 'Kingdom', 'Phylum', 'Class', 'Order', 'Family', 'Genus', 'Specific epithet', 'Species name'];
const ORG = [
  { n: 'Archean', v: ['Archaea', 'Archaebacteria', 'Deinococcus–Thermus', 'Deinococci', 'Thermales', 'Thermaceae', 'Thermus', 'aquaticus', 'Thermus aquaticus'] },
  { n: 'Bacteria', v: ['Bacteria', 'Eubacteria', 'Proteobacteria', 'Gammaproteobacteria', 'Eubacteriales', 'Enterobacteriaceae', 'Klebsiella', 'pneumonia', 'Klebsiella pneumonia'] },
  { n: 'Amoeba', v: ['Eukarya', 'Protista', 'Sarcodina', 'Lobosa', 'Amoebina', 'Amoebaea', 'Amoeba', 'Proteus', 'Amoeba proteus'] },
  { n: 'Bread mold', v: ['Eukarya', 'Fungi', 'Zygomycota', 'Zygomycetes', 'Mucorina', 'Mucoracea (Graminae)', 'Rhizopus', 'stolonifer', 'Rhizopus stolonifer'] },
  { n: 'Rice', v: ['Eukarya', 'Plantae', 'Anthophyta', 'Liliopsida', 'Poales', 'Poaceae', 'Oryza', 'sativa', 'Oryza sativa'] },
  { n: 'Man', v: ['Eukarya', 'Animalia', 'Chordata', 'Mammalia', 'Primate', 'Hominidae', 'Homo', 'sapiens', 'Homo sapiens'] }
];
const KEY = {
  1: [['Parallel leaf', '2'], ['Netted leaf', '3']],
  2: [['Herbaceous habit', 'spider lily'], ['Tree-like habit', 'coconut']],
  3: [['Has thorns on its stem', 'rose'], ['Without thorns on its stem', '4']],
  4: [['Has yellow flower', 'sunflower'], ['Has red flower', 'gumamela']]
};
const MYST = [
  { n: 'spider lily', t: 'Parallel leaves, herbaceous habit.' },
  { n: 'coconut', t: 'Parallel leaves, tree-like habit.' },
  { n: 'rose', t: 'Netted leaves, thorns on the stem.' },
  { n: 'sunflower', t: 'Netted leaves, no thorns, yellow flower.' },
  { n: 'gumamela', t: 'Netted leaves, no thorns, red flower.' }
];
const PH = [
  { p: 'Porifera', c: 'sponge', g: 'Scypha' },
  { p: 'Cnidaria', c: 'jellyfish', g: 'Aurelia' },
  { p: 'Platyhelminthes', c: 'flatworm', g: 'Schistosoma' },
  { p: 'Nematoda', c: 'roundworm', g: 'Ascaris' },
  { p: 'Annelida', c: 'earthworm', g: 'Lumbricus' },
  { p: 'Mollusca', c: 'snail', g: 'Helix' },
  { p: 'Arthropoda', c: 'cockroach', g: 'Periplaneta' },
  { p: 'Echinodermata', c: 'starfish', g: null },
  { p: 'Chordata', c: 'frog', g: 'Bufo' }
];
const FEATS = ['Level of organization', 'Germ layers', 'Type of coelom', 'Symmetry', 'Body plan', 'Segmentation'];
const DET = {
  Porifera: ['Cellular (no true tissues)', 'None', 'None (acoelomate)', 'Asymmetrical or radial', 'Porous body with water canals and a central cavity', 'Not segmented'],
  Cnidaria: ['Tissue', 'Two (diploblastic)', 'None (acoelomate)', 'Radial', 'Sac with one opening (gastrovascular cavity)', 'Not segmented'],
  Platyhelminthes: ['Organ', 'Three (triploblastic)', 'None (acoelomate)', 'Bilateral', 'Solid body, gut with one opening', 'Not segmented'],
  Nematoda: ['Organ system', 'Three (triploblastic)', 'Pseudocoelom', 'Bilateral', 'Tube within a tube, cylindrical', 'Not segmented'],
  Annelida: ['Organ system', 'Three (triploblastic)', 'True coelom', 'Bilateral', 'Tube within a tube', 'Segmented'],
  Mollusca: ['Organ system', 'Three (triploblastic)', 'True coelom (reduced)', 'Bilateral (snails are twisted by torsion)', 'Head-foot, visceral mass and mantle', 'Not segmented'],
  Arthropoda: ['Organ system', 'Three (triploblastic)', 'Hemocoel (reduced coelom)', 'Bilateral', 'Jointed appendages and an exoskeleton', 'Segmented'],
  Echinodermata: ['Organ system', 'Three (triploblastic)', 'True coelom', 'Radial as adults, bilateral as larvae', 'Spiny skin and a water vascular system', 'Not segmented'],
  Chordata: ['Organ system', 'Three (triploblastic)', 'True coelom', 'Bilateral', 'Notochord, dorsal hollow nerve cord, pharyngeal slits', 'Segmented (vertebrae, muscle blocks)']

        <p class="small">Handout adapted from Dickey (2003), Mader (1998) and Soligam-Hadsall et al. (2005).</p>
      </div>`,
    qs: [
      { q: 'Which specimen is the dicot root cross section?', o: ['Zea mays', 'Ranunculus', 'Helianthus', 'Ixora'], a: 1, why: 'The dicot root is Ranunculus sp. root c.s.' },
      { q: 'How many species does each metamorphosed organ table need at minimum?', o: ['1', '2', '3', '5'], a: 2, why: 'The handout asks for a minimum of 3 species in each table.' },
      { q: 'Xylem in the monocot root conducts…', o: ['Photosynthates from the leaves', 'Minerals from the roots to the stem', 'Only gases', 'Only pollen'], a: 1, why: 'The handout says xylem conducts minerals from the roots to the stem.' },
      { q: 'Which pair is correct?', o: ['Dicot stem, Zea mays', 'Monocot leaf, Zea mays', 'Dicot leaf, Helianthus', 'Dicot root, Zea mays'], a: 1, why: 'Zea mays is the monocot. The dicot stem is Helianthus, the dicot leaf is Ixora and the dicot root is Ranunculus.' }
    ]
  }
];

/* ---------- exercises ---------- */
const EXD = {
  7: { tab: 'Exercise 7', name: 'Photosynthesis', title: 'Photosynthesis', ch: CH7,
       lede: 'The handout for the photosynthesis lab, cut into five short chunks. Read a chunk, answer its checks, move on. Your place and answers are kept in this browser.' },
  8: { tab: 'Exercise 8', name: 'Phylogeny and Systematics', title: 'Phylogeny and Systematics', ch: CH8,
       lede: 'The handout for the survey of plant and animal families, cut into nine short chunks. Read a chunk, answer its checks, move on. Your place and answers are kept in this browser.' },
  9: { tab: 'Exercise 9', name: 'Plant Form and Function', title: 'Plant Form and Function', ch: CH9,
       lede: 'The handout for roots, stems and leaves, cut into eight short chunks. Read a chunk, answer its checks, move on. Your place and answers are kept in this browser.' }
};
let EX = S.ex;
let CH = EXD[EX].ch;

/* ---------- state helpers ---------- */
const qk = (ex, ci, qi) => (ex === 8 ? '' : 'x' + ex + '-') + ci + '-' + qi;
const isDone = (i, ex = EX) => EXD[ex].ch[i].qs.every((_, k) => S.ok[qk(ex, i, k)]);
const ownsKey = (ex, k) => ex === 8 ? !/^x\d/.test(k) : k.startsWith('x' + ex);
S.cur = S.curs[EX] || 0;
if (!(S.cur >= 0 && S.cur < CH.length)) S.cur = 0;

let orgI = 4;
let W = { m: 0, cur: '1', res: null };
let D = { score: 0, total: 0, cur: null };
let cA = 'Cnidaria', cB = 'Platyhelminthes';
let resetArmed = false;

/* ---------- rendering ---------- */
function renderHead() {
  const e = EXD[EX];
  $('#hkick').textContent = 'UP Mindanao · BIO 10 · Exercise ' + EX;
  $('#htitle').textContent = e.title;
  $('#hlede').textContent = e.lede;
  document.title = 'Bio 10 Exercise ' + EX + ' · ' + e.name;
}
function renderTabs() {
  $('#exbar').innerHTML = [7, 8, 9].map(n => {
    const c = EXD[n].ch.filter((_, i) => isDone(i, n)).length;
    return `<button type="button" class="extab" data-exn="${n}" aria-pressed="${n === EX}"><span>${EXD[n].tab}: ${EXD[n].name}</span><span class="ct">${c}/${EXD[n].ch.length}</span></button>`;
  }).join('');
}
function renderNav() {
  const dc = CH.filter((_, i) => isDone(i)).length;
  $('#nav').innerHTML =
    `<div class="prog"><p class="pc"><strong>${dc}</strong> of ${CH.length} chunks done</p><div class="bar"><span style="width:${dc / CH.length * 100}%"></span></div></div>
     <ol class="steps">${CH.map((c, i) => `<li class="step ${isDone(i) ? 'done' : ''}" ${i === S.cur ? 'aria-current="step"' : ''}><button type="button" data-chunk="${i}" aria-label="Chunk ${i + 1}: ${c.t}"><span class="n">${isDone(i) ? '✓' : i + 1}</span><span class="t">${c.t}</span></button></li>`).join('')}</ol>
     <button type="button" class="linkbtn" data-reset>${resetArmed ? 'Click again to clear progress' : 'Reset progress for this exercise'}</button>`;
  renderTabs();
}

function quizHTML(ci) {
  return `<section class="checks"><p class="label">Check yourself</p>${CH[ci].qs.map((q, qi) =>
    `<div class="q" data-q="${qi}"><p>${q.q}</p><div class="opts">${q.o.map((o, oi) => `<button type="button" class="opt" data-o="${oi}">${o}</button>`).join('')}</div><p class="fb" aria-live="polite"></p></div>`).join('')}</section>`;
}

function renderMain() {
  const c = CH[S.cur];
  $('#main').innerHTML = `<article class="chunk">
    <div><p class="eyebrow">Chunk ${S.cur + 1} of ${CH.length} · about ${c.min} min</p><h2>${c.t}</h2></div>
    ${c.intro ? `<p class="intro">${c.intro}</p>` : ''}
    ${c.pts ? `<ul class="points">${c.pts.map(p => `<li>${p}</li>`).join('')}</ul>` : ''}
    ${c.ex ? c.ex() : ''}
    ${quizHTML(S.cur)}
    <div class="foot"><button type="button" class="btn" data-go="-1" ${S.cur === 0 ? 'disabled' : ''}>Back</button><span class="stat" id="stat"></span><button type="button" class="btn" id="nextBtn" data-go="1" ${S.cur === CH.length - 1 ? 'disabled' : ''}>Next chunk</button></div>
  </article>`;
  $$('#main .q').forEach(q => { const qi = Number(q.dataset.q); if (S.ok[qk(EX, S.cur, qi)]) paintQ(q, qi); });
  if (c.init) c.init();
  updateFoot();
}

function updateFoot() {
  const n = CH[S.cur].qs.length;
  const k = CH[S.cur].qs.filter((_, i) => S.ok[qk(EX, S.cur, i)]).length;
  const st = $('#stat'); if (st) st.textContent = `Checks ${k} of ${n}`;
  const nb = $('#nextBtn'); if (nb) nb.classList.toggle('primary', k === n);
}

function paintQ(q, qi) {
  const def = CH[S.cur].qs[qi];
  $$('.opt', q).forEach((o, i) => { o.disabled = true; if (i === def.a) o.classList.add('right'); });
  const fb = $('.fb', q); fb.className = 'fb good'; fb.textContent = 'Correct. ' + def.why;
}

function answer(b) {
  const q = b.closest('.q'); const qi = Number(q.dataset.q);
  const def = CH[S.cur].qs[qi]; const key = qk(EX, S.cur, qi);
  if (S.ok[key]) return;
  const oi = Number(b.dataset.o);
  if (oi === def.a) { S.ok[key] = true; save(); paintQ(q, qi); renderNav(); updateFoot(); }
  else { b.classList.add('wrong'); b.disabled = true; const fb = $('.fb', q); fb.className = 'fb bad'; fb.textContent = 'Not quite. Try another option.'; }
}

function go(i) {
  S.cur = Math.max(0, Math.min(CH.length - 1, i)); save(); resetArmed = false;
  renderNav(); renderMain();
  const l = $('.layout'); if (l) l.scrollIntoView({ block: 'start' });
}

function switchEx(n) {
  if (n === EX) return;
  S.curs[EX] = S.cur;
  EX = n; S.ex = n; CH = EXD[n].ch;
  S.cur = S.curs[n] || 0;
  if (!(S.cur >= 0 && S.cur < CH.length)) S.cur = 0;
  save(); resetArmed = false;
  renderHead(); renderNav(); renderMain();
  const l = $('.exbar'); if (l) l.scrollIntoView({ block: 'start' });
}

/* ---------- interactive pieces ---------- */
function drawLadder() {
  const el = $('#ladder'); if (!el) return;
  const o = ORG[orgI];
  el.innerHTML = RANKS.map((r, i) => `<div class="rung ${i > 5 ? 'sp-row' : ''}" style="--i:${i}"><span class="r">${r}</span><button type="button" class="cloak">${o.v[i]}</button></div>`).join('');
  $$('#chips .chip').forEach((c, i) => c.setAttribute('aria-pressed', String(i === orgI)));
}

function drawWalker() {
  const el = $('#walk'); if (!el) return;
  const sp = MYST[W.m];
  let h = `<p class="label">Specimen</p><p class="spec">${sp.t}</p>`;
  if (W.res) {
    const ok = W.res === sp.n;
    h += `<div class="res ${ok ? 'good' : 'bad'}"><strong>The key says: ${W.res}.</strong> ${ok ? 'That matches the specimen.' : `The specimen is a ${sp.n}. Check the choices you made against its traits.`}</div>`;
  } else {
    h += `<p class="label">Pair ${W.cur}</p><div class="opts">${KEY[W.cur].map((c, i) => `<button type="button" class="opt" data-w="${i}">${c[0]}</button>`).join('')}</div>`;
  }
  h += `<div class="row"><button type="button" class="btn small" data-wnew>New specimen</button><button type="button" class="btn small" data-wreset>Start over</button></div>`;
  el.innerHTML = h;
  $$('#keytext .kc').forEach(k => k.classList.toggle('on', !W.res && k.dataset.c === W.cur));
}

function newDrill() {
  const it = PH[rnd(PH.length)];
  const byGenus = !!it.g && Math.random() < 0.5;
  const opts = shuffle([it, ...shuffle(PH.filter(x => x !== it)).slice(0, 3)]);
  D.cur = { it, byGenus, opts, done: false, pick: -1 };
}
function drawDrill() {
  const el = $('#drill'); if (!el) return;
  if (!D.cur) newDrill();
  const c = D.cur;
  el.innerHTML = `<p class="dq">${c.byGenus ? `<span class="sp">${c.it.g}</span> sp. belongs to which phylum?` : `Which phylum is represented by the ${c.it.c}?`}</p>
    <div class="opts">${c.opts.map((o, i) => `<button type="button" class="opt ${c.done ? (o === c.it ? 'right' : (i === c.pick ? 'wrong' : '')) : ''}" data-d="${i}" ${c.done ? 'disabled' : ''}>${o.p}</button>`).join('')}</div>
    <div class="row"><span class="score">Score ${D.score} of ${D.total}</span>${c.done ? '<button type="button" class="btn primary small" data-dnext>Next question</button>' : ''}</div>`;
}

function drawCompare() {
  const A = $('#selA'), B = $('#selB'); if (!A || !B) return;
  A.value = cA; B.value = cB;
  const a = DET[cA], b = DET[cB]; let diff = 0;
  const rows = FEATS.map((f, i) => { const d = a[i] !== b[i]; if (d) diff++; return `<tr class="${d ? 'diff' : ''}"><th scope="row">${f}${d ? '<span class="ne">differs</span>' : ''}</th><td>${a[i]}</td><td>${b[i]}</td></tr>`; }).join('');
  $('#cmpT').innerHTML = `<thead><tr><th>Feature</th><th>${cA}</th><th>${cB}</th></tr></thead><tbody>${rows}</tbody>`;
  $('#cmpN').textContent = diff ? `${diff} of ${FEATS.length} features differ (shaded).` : 'These two phyla share every feature listed here.';
}

/* Exercise 7: outcome picker */
function drawOut(id) {
  const el = $('#out-' + id); if (!el) return;
  $$('[data-out="' + id + '"]').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.i) === OUT[id])));
  if (OUT[id] < 0) { el.innerHTML = '<p class="hint">Say your prediction first, then pick a scenario above.</p>'; return; }
  el.innerHTML = OUTD[id][OUT[id]].cells.map(c => `<div class="ocell"><span class="sw ${c.shape || ''}" style="background:${c.col}" aria-hidden="true"></span><p class="nm">${c.n}</p><p>${c.t}</p></div>`).join('');
}

/* Exercise 9: layer explorers and metamorphosed table */
function drawLX(id) {
  const el = $('#lx-' + id); if (!el) return;
  const rows = LXD[id].sets[LXS[id]].rows;
  el.innerHTML = rows.map(r => `<div class="rung" style="--i:${r[2]}"><span class="r">${r[0]}</span><button type="button" class="cloak">${r[1]}</button></div>`).join('');
  $$('[data-lx="' + id + '"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.k === LXS[id])));
}
function drawMet() {
  const t = $('#metT'); if (!t) return;
  const m = MET[metK];
  t.innerHTML = `<thead><tr>${m.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${m.rows.map(r => `<tr><td>${r[0]}</td><td><button type="button" class="cloak">${r[1]}</button></td><td><button type="button" class="cloak">${r[2]}</button></td></tr>`).join('')}</tbody>`;
  $$('[data-met]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.met === metK)));
}

/* ---------- events ---------- */
$('#main').addEventListener('click', e => {
  const t = e.target; let b;
  if ((b = t.closest('.q .opt'))) { answer(b); return; }
  if ((b = t.closest('[data-go]'))) { go(S.cur + Number(b.dataset.go)); return; }
  if ((b = t.closest('[data-cloak-toggle]'))) {
    const box = b.closest('.cloakable'); const on = box.dataset.cloak === 'on';
    box.dataset.cloak = on ? 'off' : 'on';
    b.setAttribute('aria-pressed', String(!on));
    b.textContent = on ? b.dataset.offText : b.dataset.onText;
    $$('.cloak.shown', box).forEach(x => x.classList.remove('shown'));
    return;
  }
  if ((b = t.closest('.cloak'))) { const box = b.closest('.cloakable'); if (box && box.dataset.cloak === 'on') b.classList.add('shown'); return; }
  if ((b = t.closest('[data-org]'))) { orgI = Number(b.dataset.org); drawLadder(); return; }
  if ((b = t.closest('[data-out]'))) { OUT[b.dataset.out] = Number(b.dataset.i); drawOut(b.dataset.out); return; }
  if ((b = t.closest('[data-lx]'))) { LXS[b.dataset.lx] = b.dataset.k; drawLX(b.dataset.lx); return; }
  if ((b = t.closest('[data-met]'))) { metK = b.dataset.met; drawMet(); return; }
  if ((b = t.closest('[data-w]'))) {
    const lead = KEY[W.cur][Number(b.dataset.w)][1];
    if (KEY[lead]) W.cur = lead; else W.res = lead;
    drawWalker(); return;
  }
  if (t.closest('[data-wreset]')) { W.cur = '1'; W.res = null; drawWalker(); return; }
  if (t.closest('[data-wnew]')) { let m; do { m = rnd(MYST.length); } while (m === W.m); W = { m, cur: '1', res: null }; drawWalker(); return; }
  if ((b = t.closest('[data-d]'))) {
    const c = D.cur; if (c.done) return;
    const i = Number(b.dataset.d); c.done = true; c.pick = i; D.total++; if (c.opts[i] === c.it) D.score++;
    drawDrill(); const nx = $('[data-dnext]'); if (nx) nx.focus(); return;
  }
  if (t.closest('[data-dnext]')) { newDrill(); drawDrill(); return; }
});
$('#main').addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-todo]')) { S.todo[t.dataset.todo] = t.checked; save(); return; }
  if (t.id === 'selA') { cA = t.value; drawCompare(); return; }
  if (t.id === 'selB') { cB = t.value; drawCompare(); }
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-chunk]'); if (b) { go(Number(b.dataset.chunk)); return; }
  if (e.target.closest('[data-reset]')) {
    if (!resetArmed) { resetArmed = true; renderNav(); return; }
    Object.keys(S.ok).forEach(k => { if (ownsKey(EX, k)) delete S.ok[k]; });
    Object.keys(S.todo).forEach(k => { if (ownsKey(EX, k)) delete S.todo[k]; });
    S.cur = 0; save(); resetArmed = false; renderNav(); renderMain();
  }
});
$('#exbar').addEventListener('click', e => {
  const b = e.target.closest('[data-exn]'); if (b) switchEx(Number(b.dataset.exn));
});

renderHead();
renderNav();
renderMain();
</script>

</body></html>
